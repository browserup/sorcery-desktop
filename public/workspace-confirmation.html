<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Workspace</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-active: #4338ca;
      --bg-primary: #121212;
      --bg-surface: #1e1e1e;
      --bg-elevated: #2d2d2d;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --border: #333333;
      --warning: #f59e0b;
    }

    html {
      background: var(--bg-primary);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 1.5rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }

    .info-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .info-row {
      display: flex;
      margin-bottom: 0.75rem;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      width: 100px;
      flex-shrink: 0;
    }

    .info-value {
      color: var(--text-primary);
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 0.8125rem;
      word-break: break-all;
    }

    .hint {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }

    .hint-icon {
      color: var(--warning);
      margin-right: 0.5rem;
    }

    .hint code {
      background: var(--bg-elevated);
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 0.75rem;
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .button:active:not(:disabled) {
      background: var(--primary-active);
    }

    .button.secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .button.secondary:hover {
      background: #3d3d3d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Confirm Workspace</h1>
    <p class="subtitle">This URL doesn't use the @ prefix, so we guessed the workspace</p>

    <div class="info-panel">
      <div class="info-row">
        <span class="info-label">Workspace</span>
        <span class="info-value" id="workspace-name"></span>
      </div>
      <div class="info-row">
        <span class="info-label">File</span>
        <span class="info-value" id="file-path"></span>
      </div>
      <div class="info-row">
        <span class="info-label">Full Path</span>
        <span class="info-value" id="full-path"></span>
      </div>
    </div>

    <div class="hint">
      <span class="hint-icon">&#9432;</span>
      Tip: Use <code>srcuri://@workspace/path</code> for explicit workspace references
    </div>

    <div class="button-group">
      <button class="button secondary" onclick="cancel()">Cancel</button>
      <button class="button" onclick="confirm()">Open File</button>
    </div>
  </div>

  <script>
    let data = null;

    async function init() {
      try {
        data = await window.__TAURI__.core.invoke('get_workspace_confirmation_data');

        document.getElementById('workspace-name').textContent = data.likely_workspace;
        document.getElementById('file-path').textContent = data.path;
        document.getElementById('full-path').textContent = data.full_path;

        document.addEventListener('keydown', handleKeyPress);
      } catch (e) {
        console.error('Failed to load confirmation data:', e);
      }
    }

    async function confirm() {
      try {
        await window.__TAURI__.core.invoke('confirm_workspace');
        window.close();
      } catch (e) {
        console.error('Failed to confirm workspace:', e);
      }
    }

    function cancel() {
      window.__TAURI__.core.invoke('workspace_confirmation_cancelled').catch(() => {});
      window.close();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        confirm();
      } else if (e.key === 'Escape') {
        cancel();
      }
    }

    init();
  </script>
</body>
</html>
