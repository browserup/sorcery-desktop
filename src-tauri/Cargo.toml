[package]
name = "sorcery-desktop"
version = "0.1.4"
description = "Sorcery Desktop - Cross-platform editor hyperlink launcher"
authors = ["Eric Beland"]
license = "MIT"
repository = "https://github.com/ebeland/sorcery-desktop"
edition = "2021"

[lib]
name = "sorcery_desktop"
path = "src/lib.rs"

[[bin]]
name = "sorcery-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-deep-link = "2.4.6"
tauri-plugin-shell = "2.3.4"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-single-instance = "2.3.7"
tauri-plugin-updater = "2.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1.49", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
regex = "1.12"
urlencoding = "2.1"
async-trait = "0.1"
parking_lot = "0.12"
shellexpand = "3.1"
shell-escape = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
git2 = "0.20"
open = "5"
srcuri-core = { path = "../srcuri-core" }
jsonc-parser = { version = "0.29", features = ["serde"] }
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
openssl = { version = "0.10.75", features = ["vendored"] }
notify = "8.2"

# Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSApplication", "NSColor", "NSWindow", "NSWorkspace", "NSRunningApplication"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3.24"

[features]
docker-tests = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
# Correctness
correctness = { level = "deny", priority = -1 }

# Suspicious patterns
suspicious = { level = "warn", priority = -1 }

# Style
style = { level = "warn", priority = -1 }
needless_return = "warn"
redundant_closure_for_method_calls = "warn"

# Complexity
complexity = { level = "warn", priority = -1 }

# Performance
perf = { level = "warn", priority = -1 }
inefficient_to_string = "warn"

# Pedantic (selectively enabled)
clone_on_ref_ptr = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
used_underscore_binding = "warn"

# Security-related
panic = "warn"
unwrap_used = "warn"
expect_used = "allow"
